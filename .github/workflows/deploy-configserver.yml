name: CI/CD - Config Server

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/configserver/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-configserver.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: backend/configserver
          file: backend/configserver/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ssms-configserver:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ssms-configserver:${{ github.sha }}

      - name: Deploy Service to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app
            cd ~/app
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main || git pull origin master
            fi
            docker compose pull configserver
            docker compose up -d --no-deps configserver
