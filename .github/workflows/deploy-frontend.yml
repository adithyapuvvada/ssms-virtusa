name: CI/CD - Frontend (Angular)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ssms-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ssms-frontend:${{ github.sha }}

      - name: Deploy Service to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            mkdir -p ~/app
            cd ~/app
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main || git pull origin master
            fi
            
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              docker compose pull frontend
              docker compose up -d --no-deps frontend
            elif command -v docker-compose &> /dev/null; then
              docker-compose pull frontend
              docker-compose up -d --no-deps frontend
            else
              sudo docker compose pull frontend || sudo docker-compose pull frontend
              sudo docker compose up -d --no-deps frontend || sudo docker-compose up -d --no-deps frontend
            fi
