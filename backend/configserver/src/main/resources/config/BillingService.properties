server.port = 8073

spring.datasource.url=jdbc:mysql://localhost:3306/ssms_billing_db
spring.datasource.username=root
spring.datasource.password=Adithya@#1
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#service registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=60
eureka.instance.prefer-ip-address=true

#zipkin
#zipkin.web.rootUrl = http://localhost:9411/

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
spring.reactor.context-propagation=auto

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %c - %m%n


#logging
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.reactor.netty=DEBUG
logging.level.org.springframework.web=DEBUG

#Actuator endPoints for circuit breaker
management.health.circuitbreakers.enabled=true
#management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always

# Circuit breaker configuration
resilience4j.circuitbreaker.instances.EmployeeMicroService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.EmployeeMicroService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.EmployeeMicroService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.EmployeeMicroService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.EmployeeMicroService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.EmployeeMicroService.permittedNumberOfCallsInHalfOpenState=3

#retry configuration
resilience4j.retry.instances.EmployeeMicroService.registerHealthIndicator=true
resilience4j.retry.instances.EmployeeMicroService.maxRetryAttempts=5
resilience4j.retry.instances.EmployeeMicroService.waitDuration=10s

# kafka producer
spring.kafka.bootstrap-servers=localhost:9092

# producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer
#spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=billing-group
spring.kafka.consumer.auto-offset-reset=earliest

# Use ErrorHandlingDeserializer to handle deserialization errors
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate deserializers
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

# producer type headers (use local class)
spring.kafka.consumer.properties.spring.json.use.type.headers=true

# Allow all packages (needed for JsonDeserializer)
spring.kafka.consumer.properties.spring.json.trusted.packages=*