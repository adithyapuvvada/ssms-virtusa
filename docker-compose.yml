version: '3.8'

services:
  # -----------------------------------------------------------------
  # Databases & Infrastructure Services
  # -----------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: ssms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Adithya@#1}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ssms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ssms-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ssms-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ssms-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ssms-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ssms-zipkin
    restart: always
    ports:
      - "9411:9411"
    networks:
      - ssms-network

  # -----------------------------------------------------------------
  # Core Spring Cloud Infra Services
  # -----------------------------------------------------------------
  configserver:
    image: ${secrets.DOCKERHUB_USERNAME}/ssms-configserver:latest
    build:
      context: backend/configserver
      dockerfile: Dockerfile
    container_name: ssms-configserver
    restart: always
    ports:
      - "9999:9999"
    environment:
      SPRING_PROFILES_ACTIVE: native
    networks:
      - ssms-network

  serviceregistry:
    image: ${secrets.DOCKERHUB_USERNAME}/ssms-serviceregistry:latest
    build:
      context: backend/serviceregistry
      dockerfile: Dockerfile
    container_name: ssms-serviceregistry
    restart: always
    ports:
      - "8761:8761"
    # No external config server imports needed for Eureka registry itself
    depends_on:
      - configserver
    networks:
      - ssms-network

  apigateway:
    image: ${secrets.DOCKERHUB_USERNAME}/ssms-apigateway:latest
    build:
      context: backend/apigateway
      dockerfile: Dockerfile
    container_name: ssms-apigateway
    restart: always
    ports:
      - "8089:8089"
    environment:
      CONFIG_SERVER_URL: http://configserver:9999
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - configserver
      - serviceregistry
      - zipkin
    networks:
      - ssms-network

  # -----------------------------------------------------------------
  # Business Microservices
  # -----------------------------------------------------------------
  userservice:
    image: ${secrets.DOCKERHUB_USERNAME}/ssms-userservice:latest
    build:
      context: backend/UserService/ssms
      dockerfile: Dockerfile
    container_name: ssms-userservice
    restart: always
    ports:
      - "8071:8071"
    environment:
      CONFIG_SERVER_URL: http://configserver:9999
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ssms_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Adithya@#1}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_started
      serviceregistry:
        condition: service_started
    networks:
      - ssms-network

  shipmentservice:
    image: ${secrets.DOCKERHUB_USERNAME}/ssms-shipmentservice:latest
    build:
      context: .
      dockerfile: backend/ShipmentService/ssms/Dockerfile
    container_name: ssms-shipmentservice
    restart: always
    ports:
      - "8072:8072"
    environment:
      CONFIG_SERVER_URL: http://configserver:9999
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ssms_shipment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Adithya@#1}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      configserver:
        condition: service_started
      serviceregistry:
        condition: service_started
    networks:
      - ssms-network

  billingservice:
    image: ${secrets.DOCKERHUB_USERNAME}/ssms-billingservice:latest
    build:
      context: .
      dockerfile: backend/BillingService/ssms/Dockerfile
    container_name: ssms-billingservice
    restart: always
    ports:
      - "8073:8073"
    environment:
      CONFIG_SERVER_URL: http://configserver:9999
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ssms_billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Adithya@#1}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://serviceregistry:8761/eureka
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      configserver:
        condition: service_started
      serviceregistry:
        condition: service_started
    networks:
      - ssms-network

  # -----------------------------------------------------------------
  # Frontend Service
  # -----------------------------------------------------------------
  frontend:
    image: ${secrets.DOCKERHUB_USERNAME}/ssms-frontend:latest
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: ssms-frontend
    restart: always
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - apigateway
    networks:
      - ssms-network

networks:
  ssms-network:
    driver: bridge

volumes:
  mysql_data:
